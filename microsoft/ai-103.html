<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="Luyện tập 135 câu hỏi Microsoft AI-103 với đáp án và giải thích tiếng Việt." name="description"/>
<title>AI-103 | Learning Hub</title>
<link href="style.css" rel="stylesheet"/>
<script defer="" src="ai-103-questions.js"></script>
<script defer="" src="app.js"></script>
</head>
<body>
<header class="site-header"><a class="brand" href="../index.html"><span class="brand-symbol">L</span> Learning Hub</a><a class="github-link" href="../index.html">← Trang chủ</a></header>
<main>
<section class="intro"><p class="eyebrow">Certification prep</p><h1>Microsoft AI-103</h1><p>135 câu hỏi AI-103. Luyện tập với đáp án và giải thích tiếng Việt.</p></section>
<section aria-label="Bộ lọc câu hỏi" class="toolbar">

<label>Chế độ<select id="mode"><option value="practice">Luyện tập</option><option value="study">Đọc đáp án</option></select></label>
<label class="search">Tìm câu hỏi<input id="search" placeholder="Nhập từ khóa…" type="search"/></label>
</section>
<p aria-live="polite" id="progress" role="status"></p>
<div class="workspace">
<nav aria-label="Danh sách câu hỏi" id="question-map"></nav>
<section aria-label="Nội dung câu hỏi" id="question-area">
<article id="question-card">
<div class="question-heading"><span id="question-label"></span><span id="selection-hint"></span></div>
<div id="question-content"></div>
<form id="answer-form"><fieldset id="options"><legend class="sr-only">Chọn đáp án</legend></fieldset><button id="check" type="submit">Kiểm tra đáp án</button></form>
<section aria-label="Đáp án và giải thích" hidden="" id="feedback"><p aria-live="polite" id="result" role="status"></p><div id="explanation"></div></section>
<div class="navigation"><button id="prev" type="button">← Câu trước</button><button id="next" type="button">Câu tiếp →</button></div>
</article>
<p hidden="" id="empty">Không có câu hỏi phù hợp. Hãy thử từ khóa khác.</p>
</section>
</div>
</main>
</body>
</html>
